name: Desktop Windows Build

# Windows 桌面壳：构建 → 瘦身 → **在真实产物上验证** → 安装包安装/卸载验证 → 产物 + sha256。
# - 手动触发、推送 desktop/** 变更、以及主包发布 tag（v*）；
# - tag 时把 zip / NSIS 安装包 / sha256 挂到**同一个 tag 的 GitHub Release**
#   （与主包 tgz 同一个 Release；便携 zip 不支持自更新）；
# - 验证不是只看端口：解包后跑 desktop/scripts/verify-packaged.mjs（页面 + _next 静态资源 +
#   /api/about 版本 + node-pty + SDK 会话 + 关停/端口释放），再用真实 Electron 壳跑一次冒烟
#   （desktop/scripts/smoke-shell.mjs），最后静默安装/卸载验证安装包。

on:
  workflow_dispatch:
  push:
    # 分支推送只看 paths（tags 存在时若没写 branches，分支推送不会触发工作流）。
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-win.yml"
    # tag 推送忽略 paths，直接构包并挂 Release。
    tags:
      - "v*"

permissions:
  contents: write # tag 构建时 gh release upload

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # desktop 壳依赖 npm 包 @henlii/pidance（服务端），按 lockfile 精确安装。
      # electron 下载依赖网络；electron-builder nsis 需要再拉 nsis 工具链。
      - name: 安装 desktop 依赖（npm ci，按 lockfile）
        working-directory: desktop
        run: npm ci --include=dev --no-audit --no-fund

      - name: 检查脚本语法
        working-directory: desktop
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/server-lifecycle.js
          node --check src/update-logic.js
          node --check scripts/prune-app-tree.mjs
          node --check scripts/verify-packaged.mjs
          node --check scripts/smoke-shell.mjs

      - name: 生命周期 / 瘦身 / 更新逻辑测试
        working-directory: desktop
        run: npm test

      # 桌面壳按 lockfile 装的是 npm 上已发布的 @henlii/pidance。但 CI 要验的是**当前分支的服务端**：
      # 否则 desktop 的验证只覆盖壳本身，服务端的改动（例如 Windows 终端一连上就断）根本进不了产物，
      # 跑绿了也不代表这份代码能跑。这里走与正式发布同构的本地候选包流程，把工作区包换进去。
      - name: 用当前分支的服务端包替换 npm 上的内置服务
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "pidance-candidate"
          node scripts/make-candidate-package.mjs --build-root $root
          $tgz = Get-ChildItem (Join-Path $root "*.tgz") | Sort-Object LastWriteTime | Select-Object -Last 1
          if (!$tgz) { throw "没有生成内置服务候选包：$root" }
          Write-Host "内置服务候选包：$($tgz.FullName)"
          Push-Location desktop
          npm install --no-save --no-audit --no-fund $tgz.FullName
          Pop-Location

      - name: 校验打包输入（内置服务版本与 Electron 运行时的 Node 版本）
        working-directory: desktop
        shell: pwsh
        run: |
          $expected = (Get-Content package.json -Raw | ConvertFrom-Json).dependencies.'@henlii/pidance'
          $actual = (Get-Content node_modules/@henlii/pidance/package.json -Raw | ConvertFrom-Json).version
          Write-Host "内置服务版本：$actual（desktop/package.json 声明 $expected）"
          if ($expected -ne $actual) { throw "内置服务版本（$actual）与 desktop/package.json 声明（$expected）不一致" }
          if (!(Test-Path node_modules/electron/dist/electron.exe)) { throw "Electron runtime is missing" }
          # 服务以 ELECTRON_RUN_AS_NODE 跑在包内 Electron 自带的 Node 上：这里量的是**真实运行时**版本，
          # 不是 runner 的 node。低于主包 engines 就直接失败，不靠人记得 Electron 升级时重看。
          # electron.exe 是 GUI 子系统程序：PowerShell 直接 & / Start-Process 都拿不到它的 stdout
          # （实测 EPIPE、变量为空），所以由 node 用管道去捕。
          $env:ELECTRON_RUN_AS_NODE = "1"
          $runtime = node -e "const cp=require('node:child_process');const r=cp.spawnSync(require('node:path').join('node_modules','electron','dist','electron.exe'),['-e','process.stdout.write(process.versions.node)'],{encoding:'utf8'});if(!r.stdout)process.stderr.write(r.error?String(r.error):(r.stderr||'electron produced no output'));process.stdout.write((r.stdout||'').trim())"
          $engines = (Get-Content node_modules/@henlii/pidance/package.json -Raw | ConvertFrom-Json).engines.node
          Write-Host "Electron 自带 Node：$runtime（主包 engines：$engines）"
          node -e "const [maj,min]=process.argv[1].split('.').map(Number); if (maj<22 || (maj===22 && min<19)) throw new Error('electron node too old: '+process.argv[1]); console.log('electron node ok', process.argv[1])" "$runtime"

      - name: 构建 Windows zip（便携）
        working-directory: desktop
        run: npm run build:win:zip

      - name: 构建 NSIS 安装版
        working-directory: desktop
        run: npm run build:win:installer

      - name: 解包 zip 并验证打包输入（页面/静态资源/版本/node-pty/SDK 会话/可停）
        working-directory: desktop
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -File -Filter *.zip | Select-Object -First 1
          if (!$zip) { throw "zip artifact is missing" }
          $app = Join-Path $env:RUNNER_TEMP "unpacked"
          Remove-Item -Recurse -Force $app -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath $app -Force
          # zip 里可能是壳目录本身，也可能是多一层目录，两种都兼容。
          if (!(Test-Path (Join-Path $app "resources"))) {
            $inner = Get-ChildItem $app -Directory | Where-Object { Test-Path (Join-Path $_.FullName "resources") } | Select-Object -First 1
            if ($inner) { $app = $inner.FullName }
          }
          if (!(Test-Path (Join-Path $app "resources"))) { throw "解包目录里找不到 resources：$app" }
          node scripts/verify-packaged.mjs --app-dir $app --port 31419 --label "便携 zip"

      - name: 真实 Electron 壳冒烟（解包产物）
        working-directory: desktop
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP "unpacked"
          if (!(Test-Path (Join-Path $app "resources"))) {
            $inner = Get-ChildItem $app -Directory | Where-Object { Test-Path (Join-Path $_.FullName "resources") } | Select-Object -First 1
            if ($inner) { $app = $inner.FullName }
          }
          node scripts/smoke-shell.mjs --app-dir $app --port 31421

      - name: 安装/卸载验证（静默安装 → 壳冒烟 → 卸载干净）
        working-directory: desktop
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -File -Filter "*Setup*.exe" | Select-Object -First 1
          if (!$setup) { throw "NSIS installer is missing" }
          $install = Join-Path $env:LOCALAPPDATA "Programs\Pidance Desktop"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $exe = Join-Path $install "Pidance Desktop.exe"
          for ($i = 0; $i -lt 30 -and !(Test-Path $exe); $i++) { Start-Sleep -Seconds 2 }
          if (!(Test-Path $exe)) { throw "安装后找不到壳可执行文件：$exe" }
          $service = Join-Path $install "resources/app/node_modules/@henlii/pidance/package.json"
          if (!(Test-Path $service)) { throw "安装后找不到内置服务：$service" }
          $installedVersion = (Get-Content $service -Raw | ConvertFrom-Json).version
          $expected = (Get-Content package.json -Raw | ConvertFrom-Json).dependencies.'@henlii/pidance'
          Write-Host "安装版内置服务版本：$installedVersion"
          if ($installedVersion -ne $expected) { throw "安装版内置服务版本 $installedVersion ≠ $expected" }

          node scripts/smoke-shell.mjs --app-dir $install --port 31422

          $uninstaller = Join-Path $install "Uninstall Pidance Desktop.exe"
          if (!(Test-Path $uninstaller)) { throw "找不到卸载器：$uninstaller" }
          Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $install); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path $install) { throw "卸载后目录仍存在：$install" }
          Write-Host "安装/卸载验证通过"

      - name: 计算产物 SHA256（只算顶层制品，不含解包目录里的 exe）
        working-directory: desktop
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in ".exe", ".zip" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii dist/sha256.txt
            Write-Host "$hash  $($_.Name)"
          }

      - name: 体积摘要
        working-directory: desktop
        shell: pwsh
        run: |
          $lines = @("## 桌面产物", "", "| 项 | 大小 |", "|---|---|")
          foreach ($f in Get-ChildItem dist -File | Where-Object { $_.Extension -in ".exe", ".zip" }) {
            $lines += "| $($f.Name) | $([math]::Round($f.Length / 1MB, 1)) MB |"
          }
          $lines += ""
          $lines | Add-Content $env:GITHUB_STEP_SUMMARY
          $lines | Write-Host

      - name: 上传产物（zip + Setup exe + sha256）
        uses: actions/upload-artifact@v4
        with:
          name: pidance-desktop-win
          path: |
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: 挂到主包同名 Release（仅 v* tag）
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $repo = "${{ github.repository }}"
          # release.yml 也会在同一个 tag 上创建 Release（含主包 tgz）；等它出现再上传。
          for ($i = 0; $i -lt 60; $i++) {
            gh release view $env:TAG --repo $repo *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 15
          }
          if ($LASTEXITCODE -ne 0) { throw "Release $env:TAG 迟迟没有出现，无法挂桌面产物" }
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in ".exe", ".zip" } | ForEach-Object { $_.FullName }
          gh release upload $env:TAG --repo $repo --clobber $files dist/sha256.txt
          gh release view $env:TAG --repo $repo --json assets --jq '.assets[].name'

      # 诊断，不阻塞：CLI 从跟产物不同盘的目录启动时，Next 还能不能找到路由清单。
      # 壳自己总是以服务目录为 cwd（desktop/src/main.js），不走这条路径；
      # 这里只是把 CLI 的真实风险面量出来，方便决定要不要单独修。
      - name: "跨盘 cwd 诊断（CLI 从 C: 启动 D: 上的包，不阻塞）"
        if: always()
        continue-on-error: true
        working-directory: desktop
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP "unpacked"
          if (!(Test-Path (Join-Path $app "resources"))) {
            $inner = Get-ChildItem $app -Directory | Where-Object { Test-Path (Join-Path $_.FullName "resources") } | Select-Object -First 1
            if ($inner) { $app = $inner.FullName }
          }
          $entry = Join-Path $app "resources/app/node_modules/@henlii/pidance/bin/pidance.js"
          $exe = Join-Path $app "Pidance Desktop.exe"
          if (!(Test-Path $entry) -or !(Test-Path $exe)) { Write-Host "跳过：解包产物不完整"; exit 0 }
          $cwd = Join-Path $env:RUNNER_TEMP "cli-probe"
          New-Item -ItemType Directory -Force -Path $cwd | Out-Null
          Write-Host "产物在 $app，cwd 在 $cwd"
          $env:ELECTRON_RUN_AS_NODE = "1"
          $proc = Start-Process -FilePath $exe -WorkingDirectory $cwd -PassThru -NoNewWindow `
            -ArgumentList @($entry, "--port", "31423", "--hostname", "127.0.0.1", "--no-open")
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:31423/api/home" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
            if ($proc.HasExited) { Write-Host "进程已退出，退出码 $($proc.ExitCode)"; break }
          }
          if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          if ($ok) { Write-Host "✓ 跨盘 cwd 也能起来" }
          else { Write-Host "✗ 跨盘 cwd 起不来：CLI 从其他盘运行时需要额外处理（桌面壳不受影响）" }
