name: Release

# 可信发布（npm Trusted Publishing / OIDC）：
# push v* tag 触发 → 隔离构建 → 前后审计 → npm publish --provenance（无长期 token）→ GitHub Release（同一 tgz + sha256）。
# 本地不执行任何自动 publish；审计失败即中止（fail closed）。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # gh release create
  id-token: write # npm OIDC provenance（不发 token）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 中性构建根：与本地发布（/tmp/pidance-release-build）一致，避免 GitHub
      # runner 路径（/home/runner/...）被 webpack 嵌入产物触发敏感路径审计红线。
      # 原始 checkout 保留在 $GITHUB_WORKSPACE（审计 SOURCE_ROOT 要求与其不同）。
      - name: 复制源码到中性构建根（构建/发布用）
        run: cp -a "$GITHUB_WORKSPACE" /tmp/pidance-release-build

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: 安装依赖（含 dev，构建与审计需要）
        working-directory: /tmp/pidance-release-build
        run: npm ci --no-audit --no-fund --include=dev

      - name: 生产构建（webpack，隔离 .next）
        working-directory: /tmp/pidance-release-build
        run: node_modules/.bin/next build --webpack

      - name: 生成前审计（pre-pack dry-run + 敏感扫描）
        working-directory: /tmp/pidance-release-build
        env:
          PIDANCE_RELEASE_SOURCE_ROOT: ${{ github.workspace }}
        run: npm run release:audit

      - name: 打包（tgz 文件名用 package.json 版本，非 tag 名）
        working-directory: /tmp/pidance-release-build
        run: |
          echo "PKG_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          npm pack --ignore-scripts

      - name: 生成后审计（解析真实 tgz，fail closed）
        working-directory: /tmp/pidance-release-build
        env:
          PIDANCE_RELEASE_SOURCE_ROOT: ${{ github.workspace }}
        run: node scripts/audit-release-package.mjs --tgz henlii-pidance-${{ env.PKG_VERSION }}.tgz

      - name: 生成 SHA-256
        working-directory: /tmp/pidance-release-build
        run: sha256sum henlii-pidance-${{ env.PKG_VERSION }}.tgz | tee henlii-pidance-${{ env.PKG_VERSION }}.tgz.sha256

      - name: 发布到 npm（OIDC provenance，官方源；版本已存在则跳过）
        working-directory: /tmp/pidance-release-build
        run: |
          if npm view "@henlii/pidance@$PKG_VERSION" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "版本 $PKG_VERSION 已存在，跳过 publish（首次发布需手动 bootstrap）"
          else
            npm publish henlii-pidance-$PKG_VERSION.tgz --access public --provenance --registry https://registry.npmjs.org/
          fi

      - name: 生成发布说明（优先人工双语 docs/release-notes/<tag>.md，回退 commit 列表）
        working-directory: /tmp/pidance-release-build
        run: |
          NOTES=docs/release-notes/${{ github.ref_name }}.md
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-notes.md
          else
            PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
            { echo "# ${{ github.ref_name }}"; echo ""; echo "## 中文（Chinese）"; echo ""; echo "自 $PREV 以来的变更（Changes since $PREV）："; echo '```'; } > release-notes.md
            if [ -n "$PREV" ]; then git log --oneline --no-decorate $PREV..HEAD | head -60; else git log --oneline --no-decorate -60 HEAD; fi >> release-notes.md
            { echo '```'; echo ""; echo "---"; echo ""; echo "## English"; echo ""; echo "Changes since $PREV（commits）:"; echo '```'; } >> release-notes.md
            if [ -n "$PREV" ]; then git log --oneline --no-decorate $PREV..HEAD | head -60; else git log --oneline --no-decorate -60 HEAD; fi >> release-notes.md
            { echo '```'; echo ""; echo "## 安装 / Install"; echo ""; echo "npm 包 / npm package: \`@henlii/pidance@${{ env.PKG_VERSION }}\`（CLI 仅 \`pidance\`，端口 31415）"; echo "Windows 安装版 / Windows installer: \`Pidance Desktop\`（见下方 Assets）"; } >> release-notes.md
          fi

      - name: 创建 GitHub Release（同一 tgz + sha256；已存在则跳过）
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: /tmp/pidance-release-build
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} 已存在，跳过"
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --verify-tag \
              --title "${{ github.ref_name }}" \
              --notes-file release-notes.md \
              henlii-pidance-${{ env.PKG_VERSION }}.tgz \
              henlii-pidance-${{ env.PKG_VERSION }}.tgz.sha256
          fi

  build-windows-installer:
    name: Build Windows NSIS installer
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 校验 Web 与 desktop 版本一致
        working-directory: desktop
        shell: pwsh
        run: |
          $webVersion = (Get-Content ../package.json -Raw | ConvertFrom-Json).version
          $desktopVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($webVersion -ne $desktopVersion) { throw "Version mismatch: web=$webVersion desktop=$desktopVersion" }
          if ("v$desktopVersion" -ne $env:GITHUB_REF_NAME) { throw "Tag mismatch: tag=$env:GITHUB_REF_NAME desktop=$desktopVersion" }

      - name: 安装 desktop 依赖
        working-directory: desktop
        run: npm ci --include=dev --no-audit --no-fund

      - name: 检查桌面壳脚本语法
        working-directory: desktop
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check scripts/fetch-node-win.mjs

      - name: 瘦身打包输入（与 desktop-win.yml 同步：仅删调试/dev 资产，零运行引用）
        working-directory: desktop
        shell: pwsh
        run: |
          # sourcemap：next / pi-sdk 调试数据，运行时无 require，删掉
          Get-ChildItem node_modules -Recurse -File -Filter *.map -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          # 非 win32 平台 SWC 原生残留（本机 windows 只装 win32；防平台残差）
          Get-ChildItem node_modules/@next -Directory -Filter "swc-*" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike "*win32*" } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          # next dev 诊断/调试产物（生产服务不 require）
          Remove-Item -Recurse -Force node_modules/next/dist/diagnostics -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force node_modules/next/dist/compiled/next-devtools -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force node_modules/.cache -ErrorAction SilentlyContinue
          Write-Host "slim done"

      - name: 下载捆绑 Node win-x64
        working-directory: desktop
        run: npm run fetch-node

      - name: 校验打包输入
        working-directory: desktop
        shell: pwsh
        run: |
          if (!(Test-Path node/node.exe)) { throw "bundled node/node.exe is missing" }
          if (!(Test-Path node_modules/@henlii/pidance/bin/pidance.js)) { throw "Pidance package is missing" }

      - name: 构建 NSIS 安装版
        working-directory: desktop
        run: npm run build:win:installer

      - name: 计算并上传 Windows 安装版到 Release
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem dist -Filter *.exe -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one installer, found $($installers.Count)" }
          $installer = $installers[0]
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Out-File -Encoding ascii dist/sha256.txt
          gh release upload $env:GITHUB_REF_NAME $installer.FullName (Join-Path (Get-Location) "dist/sha256.txt") --repo $env:GITHUB_REPOSITORY --clobber
          Write-Host "$hash  $($installer.Name)"