name: Release

# 可信发布（npm Trusted Publishing / OIDC）：
# push v* tag 触发 → 隔离构建 → 前后审计 → npm publish --provenance（无长期 token）→ GitHub Release（同一 tgz + sha256）。
# 本地不执行任何自动 publish；审计失败即中止（fail closed）。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # gh release create
  id-token: write # npm OIDC provenance（不发 token）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 中性构建根：与本地发布（/tmp/pidance-release-build）一致，避免 GitHub
      # runner 路径（/home/runner/...）被 webpack 嵌入产物触发敏感路径审计红线。
      # 原始 checkout 保留在 $GITHUB_WORKSPACE（审计 SOURCE_ROOT 要求与其不同）。
      - name: 复制源码到中性构建根（构建/发布用）
        run: cp -a "$GITHUB_WORKSPACE" /tmp/pidance-release-build

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: 安装依赖（含 dev，构建与审计需要）
        working-directory: /tmp/pidance-release-build
        run: npm ci --no-audit --no-fund --include=dev

      - name: 生产构建（webpack，隔离 .next）
        working-directory: /tmp/pidance-release-build
        run: node_modules/.bin/next build --webpack

      - name: 生成前审计（pre-pack dry-run + 敏感扫描）
        working-directory: /tmp/pidance-release-build
        env:
          PIDANCE_RELEASE_SOURCE_ROOT: ${{ github.workspace }}
        run: npm run release:audit

      - name: 打包（tgz 文件名用 package.json 版本，非 tag 名）
        working-directory: /tmp/pidance-release-build
        run: |
          echo "PKG_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          npm pack --ignore-scripts

      - name: 生成后审计（解析真实 tgz，fail closed）
        working-directory: /tmp/pidance-release-build
        env:
          PIDANCE_RELEASE_SOURCE_ROOT: ${{ github.workspace }}
        run: node scripts/audit-release-package.mjs --tgz henlii-pidance-${{ env.PKG_VERSION }}.tgz

      - name: 生成 SHA-256
        working-directory: /tmp/pidance-release-build
        run: sha256sum henlii-pidance-${{ env.PKG_VERSION }}.tgz | tee henlii-pidance-${{ env.PKG_VERSION }}.tgz.sha256

      - name: 发布到 npm（OIDC provenance，官方源；版本已存在则跳过）
        working-directory: /tmp/pidance-release-build
        run: |
          if npm view "@henlii/pidance@$PKG_VERSION" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "版本 $PKG_VERSION 已存在，跳过 publish（首次发布需手动 bootstrap）"
          else
            npm publish henlii-pidance-$PKG_VERSION.tgz --access public --provenance --registry https://registry.npmjs.org/
          fi

      - name: 生成发布说明
        working-directory: /tmp/pidance-release-build
        run: |
          echo "## v${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "来自 \`git log\`（相对上一 tag）：" >> release-notes.md
          echo '```' >> release-notes.md
          PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then git log --oneline --no-decorate $PREV..HEAD | head -60; else git log --oneline --no-decorate -60 HEAD; fi >> release-notes.md
          echo '```' >> release-notes.md
          echo "" >> release-notes.md
          echo "npm 包：\`@henlii/pidance@${{ github.ref_name }}\`（CLI 仅 \`pidance\`，端口 31415）" >> release-notes.md

      - name: 创建 GitHub Release（同一 tgz + sha256；已存在则跳过）
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: /tmp/pidance-release-build
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} 已存在，跳过"
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --verify-tag \
              --title "${{ github.ref_name }}" \
              --notes-file release-notes.md \
              henlii-pidance-${{ env.PKG_VERSION }}.tgz \
              henlii-pidance-${{ env.PKG_VERSION }}.tgz.sha256
          fi
